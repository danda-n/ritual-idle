<!-- @dsCard group="Spacing" viewport="700x170" name="Radii & elevation" subtitle="Square-ish woodcut blocks; elevation by lightness" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><script src="../assets/icons.js"></script>
<style>body{padding:20px;background:var(--color-bg)} .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start} .sw{display:flex;flex-direction:column;gap:6px;width:100px} .sw i{display:block;height:56px;border-radius:4px} .sw b{font-weight:500;font-size:13px} .sw span{font-size:12px;color:var(--color-text-3)} .k{font:12px/1.3 ui-monospace,monospace;color:var(--color-text-3)}</style></head><body><div class="row">
<div class="sw"><i style="background:var(--color-surface);border-radius:3px"></i><b>3px</b><span>buttons, chips</span></div>
<div class="sw"><i style="background:var(--color-surface);border-radius:4px"></i><b>4px</b><span>panels</span></div>
<div class="sw"><i style="background:var(--color-raised);border-radius:6px;box-shadow:var(--shadow-2)"></i><b>6px + shadow-2</b><span>dialogs only</span></div>
<div class="sw"><i style="background:var(--color-sunken);height:6px;margin-top:25px;margin-bottom:25px;position:relative"><i style="position:absolute;inset:0;right:40%;height:6px;background:var(--color-text-2);border-radius:0"></i></i><b>0px</b><span>bars: square ends</span></div></div></body></html>
