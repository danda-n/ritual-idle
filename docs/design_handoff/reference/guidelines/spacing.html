<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><script src="../assets/icons.js"></script>
<style>body{padding:20px;background:var(--color-bg)} .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start} .sw{display:flex;flex-direction:column;gap:6px;width:100px} .sw i{display:block;height:56px;border-radius:4px} .sw b{font-weight:500;font-size:13px} .sw span{font-size:12px;color:var(--color-text-3)} .k{font:12px/1.3 ui-monospace,monospace;color:var(--color-text-3)}</style></head><body><div class="panel" style="display:flex;gap:20px;align-items:flex-end"><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><i style="display:block;width:var(--space-1);height:var(--space-1);background:var(--color-text-2)"></i><span class="k">1</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><i style="display:block;width:var(--space-2);height:var(--space-2);background:var(--color-text-2)"></i><span class="k">2</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><i style="display:block;width:var(--space-3);height:var(--space-3);background:var(--color-text-2)"></i><span class="k">3</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><i style="display:block;width:var(--space-4);height:var(--space-4);background:var(--color-text-2)"></i><span class="k">4</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><i style="display:block;width:var(--space-5);height:var(--space-5);background:var(--color-text-2)"></i><span class="k">5</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><i style="display:block;width:var(--space-6);height:var(--space-6);background:var(--color-text-2)"></i><span class="k">6</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><i style="display:block;width:var(--space-7);height:var(--space-7);background:var(--color-text-2)"></i><span class="k">7</span></div>
<div style="margin-left:auto;display:flex;flex-direction:column;gap:4px"><i style="display:block;width:160px;height:36px;background:var(--color-raised)"></i><span class="k">--row-h 36</span></div></div></body></html>
