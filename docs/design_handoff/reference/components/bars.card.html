<!-- @dsCard group="Components" viewport="700x190" name="Progress bars" subtitle="Flat fills, square ends, no track border" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><script src="../assets/icons.js"></script>
<style>body{padding:20px;background:var(--color-bg)} .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start} .sw{display:flex;flex-direction:column;gap:6px;width:100px} .sw i{display:block;height:56px;border-radius:4px} .sw b{font-weight:500;font-size:13px} .sw span{font-size:12px;color:var(--color-text-3)} .k{font:12px/1.3 ui-monospace,monospace;color:var(--color-text-3)}</style></head><body><div class="panel" style="display:grid;grid-template-columns:160px 1fr;gap:10px 16px;align-items:center">
<span class="meta">Action timer (skill)</span><span class="bar timed" data-skill="chandlery"><span class="bar-fill" style="animation-duration:3.8s"></span></span>
<span class="meta">Skill XP (thin)</span><span class="bar thin" data-skill="herbalism"><span class="bar-fill" style="--v:.7"></span></span>
<span class="meta">Chapter / step</span><span class="bar"><span class="bar-fill" style="--v:.33"></span></span>
<span class="meta">Delivery complete</span><span class="bar is-done"><span class="bar-fill" style="--v:1"></span></span>
<span class="meta">Blessing drain</span><span class="bar thin drain" data-skill="ritualism"><span class="bar-fill" style="--v:.55"></span></span>
<span class="meta">Rite phase</span><span class="bar rite"><span class="bar-fill" style="--v:.6"></span></span></div></body></html>
